name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build PKTracker.sln -c Release --nologo
      # Тестам не нужны ни PostgreSQL, ни файлы истории: корпусные тесты пропускаются сами
      - name: Test
        run: dotnet test tests/PKTracker.Tests -c Release --nologo --no-build
